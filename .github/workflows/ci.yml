name: Build and validate RulesBook plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Analyze source and verify PHAR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out RulesBook and pinned libBook source
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Verify the libBook submodule revision
        shell: bash
        run: test "$(git -C virions/libBook rev-parse HEAD)" = "$(git rev-parse HEAD:virions/libBook)"

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl-PM PHP setup helper
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl-PM PHP environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node "$GITHUB_WORKSPACE/.devtools-dependencies/setup-php-action/dist/index.js"

      - name: Prepare the pinned libBook virion
        run: php tools/prepare-libbook.php

      - name: Lint RulesBook source and preparation script
        shell: bash
        run: find src tools -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPStan max and build with DevTools
        id: build
        uses: NhanAZ/DevTools@8d13a75aaf4f330fdbd93737d58be9cacc41e262
        with:
          virions: .devtools-virions
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm

      - name: Verify PHAR checksum and bundled licenses
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$PHAR_SHA256" "$PHAR_PATH" | sha256sum --check --status
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["LICENSE","THIRD_PARTY_NOTICES.md","META-INF/virions/libBook/LICENSE"] as $f){if(!isset($p[$f])){throw new RuntimeException("Missing PHAR notice: ".$f);}}'
          cp "$BUILD_METADATA" build/build-metadata.json

      - name: Upload verified RulesBook PHAR
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RulesBook-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/build-metadata.json
          if-no-files-found: error
          retention-days: 14
